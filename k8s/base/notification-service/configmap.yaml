apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-service-config
  namespace: ecommerce
data:
  HEALTH_PORT: "8080"
  # SMTP server for order emails. Defaults to Amazon SES in us-east-1 (STARTTLS
  # on 587); credentials go in notification-service-secret. FROM_EMAIL must be
  # a sender or domain verified in SES.
  SMTP_HOST: email-smtp.us-east-1.amazonaws.com
  SMTP_PORT: "587"
  FROM_EMAIL: noreply@ecommerce.com
